    <script>
      (function () {
        var supported = ["en", "pt", "es", "zh", "ar"];
        var firstSegment = window.location.pathname.split("/").filter(Boolean)[0];
        var fromPath = supported.indexOf(firstSegment) > -1 ? firstSegment : null;
        var stored = null;
        try { stored = window.localStorage.getItem("smartResearchPreferredLanguage"); } catch (e) {}
        var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
        var detected = "en";
        for (var i = 0; i < languages.length; i++) {
          var raw = String(languages[i] || "").toLowerCase();
          var base = raw.split("-")[0];
          if (raw.indexOf("zh") === 0) { detected = "zh"; break; }
          if (supported.indexOf(base) > -1) { detected = base; break; }
        }
        var lang = fromPath || (supported.indexOf(stored) > -1 ? stored : detected);
        document.documentElement.lang = lang;
        window.__SMART_RESEARCH_INITIAL_LANGUAGE__ = lang;
      })();
    </script>
